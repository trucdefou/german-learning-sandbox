<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B1 Deutsch — 350 Übungen</title>
<link href="assets/img/favicon.png" rel="icon">
<link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
/* Tiya Golf Club inspired palette */
:root{
  --white:#ffffff;
  --primary:#81B29A;
  --secondary:#3D405B;
  --section-bg:#F4F1DE;
  --btn-bg:#F2CC8F;
  --btn-hover:#E07A5F;
  --dark:#000000;
  --p:#717275;
  --link-hover:#F2CC8F;
  --ok:#5aab8a;
  --err:#c96060;
  --brd:#e8e3d0;
  --font:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--white);color:var(--p);font-family:var(--font);font-weight:400;min-height:100vh;line-height:1.65}
header{border-bottom:1px solid var(--brd);padding:1.8rem 2.5rem 1.5rem;display:flex;justify-content:space-between;align-items:flex-end;position:sticky;top:0;z-index:100;background:rgba(255,255,255,.95);backdrop-filter:blur(12px)}
.h-left h1{font-family:var(--font);font-size:1.9rem;color:var(--secondary);font-weight:700;letter-spacing:-1px}
.h-left span{font-size:.7rem;color:var(--primary);letter-spacing:.15em;text-transform:uppercase;display:block;margin-bottom:.3rem;font-weight:500}
.score-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:.4rem}
.score-badge{font-size:.85rem;color:var(--white);background:var(--primary);padding:.4rem 1.1rem;border-radius:100px;letter-spacing:.03em;font-weight:500}
.pct-badge{font-size:.75rem;color:var(--p);letter-spacing:.03em}
.tabs{display:flex;flex-wrap:wrap;gap:.5rem;padding:1rem 2.5rem .9rem;background:var(--section-bg);position:sticky;top:88px;z-index:90;border-bottom:1px solid var(--brd)}
.tab-btn{background:var(--white);border:1px solid var(--brd);color:var(--secondary);font-family:var(--font);font-size:.72rem;letter-spacing:.05em;padding:.45rem 1rem;cursor:pointer;border-radius:100px;text-transform:uppercase;font-weight:500;transition:all .2s}
.tab-btn:hover,.tab-btn.active{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--secondary)}
.tab-btn .cnt{display:inline-block;background:rgba(61,64,91,.08);border-radius:100px;padding:0 .5rem;margin-left:.4rem;font-size:.65rem;color:var(--secondary)}
.tab-btn.active .cnt{background:rgba(61,64,91,.2);color:var(--secondary)}
.container{max-width:860px;margin:0 auto;padding:2.5rem 1.5rem 7rem}
.sec-hdr{display:flex;align-items:center;gap:1rem;margin:2.5rem 0 1.2rem}
.sec-hdr::before{content:attr(data-num);font-size:.7rem;color:var(--white);background:var(--secondary);padding:.3rem .75rem;border-radius:100px;letter-spacing:.05em;white-space:nowrap;font-weight:500}
.sec-hdr h2{font-family:var(--font);font-size:1.5rem;color:var(--secondary);font-weight:700;letter-spacing:-.5px}
.sec-hdr::after{content:'';flex:1;height:1px;background:linear-gradient(to right,var(--brd),transparent)}
.subsec{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--primary);margin:2rem 0 .8rem;padding-left:.7rem;border-left:3px solid var(--primary);font-weight:500}
.card{background:var(--white);border:1px solid var(--brd);border-left:4px solid transparent;border-radius:20px;padding:1.4rem 1.6rem;margin-bottom:1rem;transition:border-color .2s,box-shadow .2s;position:relative;box-shadow:0 2px 6px rgba(61,64,91,.04)}
.card:hover{border-left-color:var(--primary);box-shadow:0 4px 16px rgba(61,64,91,.08)}
.card.ok{border-left-color:var(--ok)}
.card.err{border-left-color:var(--err)}
.card-num{font-size:.7rem;color:var(--p);position:absolute;top:.8rem;right:1rem;background:var(--section-bg);padding:.18rem .6rem;border-radius:100px}
.prompt{font-size:.95rem;color:var(--secondary);margin-bottom:1rem;line-height:1.75}
.prompt em{color:var(--primary);font-style:normal;font-weight:500}
.prompt strong{color:var(--btn-hover);font-weight:700}
.choices{display:grid;gap:.5rem}
.opt{background:var(--section-bg);border:1px solid var(--brd);color:var(--secondary);font-family:var(--font);font-size:.9rem;padding:.7rem 1rem;text-align:left;cursor:pointer;border-radius:10px;transition:all .15s;display:flex;align-items:flex-start;gap:.7rem}
.opt:hover:not(:disabled){background:var(--white);color:var(--secondary);border-color:var(--primary)}
.opt .ltr{font-family:var(--font);font-size:.78rem;color:var(--primary);min-width:1rem;flex-shrink:0;margin-top:.1rem;font-weight:700}
.opt.ok{background:rgba(129,178,154,.15);border-color:var(--ok);color:#2d6a4f}
.opt.err{background:rgba(224,122,95,.12);border-color:var(--err);color:#a04545}
.opt:disabled{cursor:default}
.inp{background:var(--white);border:1px solid var(--brd);color:var(--secondary);font-family:var(--font);font-size:.9rem;padding:.55rem .9rem;border-radius:10px;outline:none;transition:border-color .2s;margin-top:.2rem}
.inp:focus{border-color:var(--primary)}
.inp.ok{border-color:var(--ok);color:#2d6a4f}
.inp.err{border-color:var(--err);color:#a04545}
.inp-sm{width:140px}.inp-md{width:220px}.inp-lg{width:100%}
textarea.inp{width:100%;min-height:70px;resize:vertical;font-family:var(--font);line-height:1.6}
.btn{background:var(--btn-bg);border:none;color:var(--secondary);font-family:var(--font);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;padding:.55rem 1.2rem;cursor:pointer;border-radius:100px;margin-top:.8rem;font-weight:700;transition:all .2s}
.btn:hover{background:var(--btn-hover);color:var(--white)}
.fb{margin-top:.7rem;font-size:.87rem;padding:.6rem .95rem;border-radius:10px;display:none;line-height:1.55}
.fb.show{display:block}
.fb.ok{background:rgba(129,178,154,.12);color:#2d6a4f;border-left:3px solid var(--ok)}
.fb.err{background:rgba(224,122,95,.1);color:#a04545;border-left:3px solid var(--err)}
.hint-lnk{font-size:.78rem;color:var(--primary);cursor:pointer;margin-top:.5rem;display:inline-block;transition:color .2s;font-weight:500}
.hint-lnk:hover{color:var(--btn-hover)}
.hint-box{display:none;font-size:.85rem;color:var(--secondary);background:rgba(129,178,154,.08);padding:.5rem .85rem;border-left:3px solid var(--primary);border-radius:0 10px 10px 0;margin-top:.5rem;font-style:italic;line-height:1.55}
.hint-box.show{display:block}
.fill-row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-top:.3rem}
.pg-info{font-size:.75rem;color:var(--p);text-align:center;margin:1.5rem 0 .5rem;letter-spacing:.05em}
.pg-btns{display:flex;gap:.5rem;justify-content:center;margin-bottom:1rem;flex-wrap:wrap}
.pg-btn{background:var(--white);border:1px solid var(--brd);color:var(--secondary);font-family:var(--font);font-size:.75rem;padding:.4rem .9rem;cursor:pointer;border-radius:100px;transition:all .15s;font-weight:500}
.pg-btn:hover{border-color:var(--primary);color:var(--primary)}
.pg-btn.active-pg{background:var(--primary);border-color:var(--primary);color:var(--white)}
.pbar-wrap{position:fixed;bottom:0;left:0;right:0;height:4px;background:var(--section-bg);z-index:200}
.pbar{height:100%;background:linear-gradient(to right,var(--primary),var(--btn-bg));width:0%;transition:width .4s}
.fb i[class^="bi-"],.hint-lnk i[class^="bi-"]{margin-right:.3rem;font-size:.95em;vertical-align:-.05em}
@media(max-width:600px){header{padding:1.2rem 1rem;flex-direction:column;align-items:flex-start;gap:.8rem}.tabs{padding:.8rem 1rem;top:auto;position:relative}.container{padding:1.5rem 1rem 5rem}.card{padding:1.2rem}}
</style>
</head>
<body>
<header>
  <div class="h-left">
    <span>Prüfungsvorbereitung · 350 Übungen · Niveau B1</span>
    <h1>Deutsches B1 — Komplettheft</h1>
  </div>
  <div class="score-wrap">
    <div class="score-badge" id="scoreBadge">0 / 0 richtig</div>
    <div class="pct-badge" id="pctBadge">—% Trefferquote</div>
  </div>
</header>
<div class="tabs" id="tabBar"></div>
<div class="container" id="mainContainer"></div>
<div class="pbar-wrap"><div class="pbar" id="pbar"></div></div>
<script>
const SECTIONS=[
{id:'grammatik',label:'Grammatik',num:'01',title:'Artikel & Deklination',exercises:[
{type:'mc',id:'g1',sub:'Artikel',q:'Welcher Artikel passt?<br><strong>„___ Sonne scheint heute."</strong>',opts:['Der','Die','Das','Den'],ans:1,exp:'<em>die Sonne</em> (feminin).'},
{type:'mc',id:'g2',sub:'Artikel',q:'<strong>„___ Hund spielt im Garten."</strong>',opts:['Der','Die','Das','Dem'],ans:0,exp:'<em>der Hund</em> (maskulin).'},
{type:'mc',id:'g3',sub:'Artikel',q:'<strong>„___ Kind schläft."</strong>',opts:['Der','Die','Das','Den'],ans:2,exp:'<em>das Kind</em> (neutrum).'},
{type:'mc',id:'g4',sub:'Artikel',q:'Akkusativ: <strong>„Ich sehe ___ Mann."</strong>',opts:['der','den','dem','des'],ans:1,exp:'Akkusativ maskulin → <em>den Mann</em>.'},
{type:'fill',id:'g5',sub:'Artikel',q:'Ergänze den bestimmten Artikel (Nom.):<br><strong>„___ Tisch ist neu."</strong>',inp:'blank',ans:['der'],exp:'<em>der Tisch</em> (maskulin).'},
{type:'fill',id:'g6',sub:'Artikel',q:'Ergänze (Nom.): <strong>„___ Blume ist schön."</strong>',inp:'blank',ans:['die'],exp:'<em>die Blume</em> (feminin).'},
{type:'mc',id:'g7',sub:'Artikel',q:'Unbestimmter Artikel: <strong>„Das ist ___ Auto."</strong>',opts:['ein','eine','einen','einem'],ans:0,exp:'Neutrum Nom. → <em>ein Auto</em>.'},
{type:'mc',id:'g8',sub:'Artikel',q:'<strong>„Ich habe ___ Schwester."</strong>',opts:['ein','eine','einen','einem'],ans:1,exp:'Akkusativ feminin → <em>eine Schwester</em>.'},
{type:'mc',id:'g9',sub:'Possessivartikel',q:'<strong>„Das ist ___ Buch." (ich)</strong>',opts:['mein','meine','meinen','meinem'],ans:0,exp:'Neutrum Nom. → <em>mein Buch</em>.'},
{type:'mc',id:'g10',sub:'Possessivartikel',q:'<strong>„Wo ist ___ Tasche?" (du)</strong>',opts:['dein','deine','deinen','deinem'],ans:1,exp:'Feminin Nom. → <em>deine Tasche</em>.'},
{type:'fill',id:'g11',sub:'Possessivartikel',q:'Ergänze (er, maskulin Nom.):<br><strong>„___ Vater arbeitet viel."</strong>',inp:'blank',ans:['sein'],exp:'<em>sein Vater</em>.'},
{type:'fill',id:'g12',sub:'Possessivartikel',q:'Ergänze (wir, Plural):<br><strong>„___ Kinder sind klein."</strong>',inp:'blank',ans:['unsere'],exp:'Plural → <em>unsere Kinder</em>.'},
{type:'mc',id:'g13',sub:'Possessivartikel',q:'Akkusativ: <strong>„Ich besuche ___ Oma." (ich)</strong>',opts:['mein','meine','meinen','meinem'],ans:1,exp:'Feminin Akk. → <em>meine Oma</em>.'},
{type:'mc',id:'g14',sub:'Possessivartikel',q:'<strong>„Sie liebt ___ Job." (sie)</strong>',opts:['ihr','ihre','ihren','ihrem'],ans:2,exp:'Maskulin Akk. → <em>ihren Job</em>.'},
{type:'fill',id:'g15',sub:'Adjektivendungen',q:'Ergänze (Nom. Mask., best. Artikel):<br><strong>„Der neu___ Computer ist schnell."</strong>',inp:'blank',ans:['e'],exp:'Nom. Mask., best. Artikel → <em>-e</em>.'},
{type:'fill',id:'g16',sub:'Adjektivendungen',q:'Ergänze (Nom. Fem., best. Artikel):<br><strong>„Die rot___ Jacke gefällt mir."</strong>',inp:'blank',ans:['e'],exp:'Nom. Fem., best. Artikel → <em>-e</em>.'},
{type:'fill',id:'g17',sub:'Adjektivendungen',q:'Ergänze (Nom. Neutr., best. Artikel):<br><strong>„Das klein___ Kind weint."</strong>',inp:'blank',ans:['e'],exp:'Nom. Neutr., best. Artikel → <em>-e</em>.'},
{type:'fill',id:'g18',sub:'Adjektivendungen',q:'Ergänze (Akk. Mask., best. Artikel):<br><strong>„Ich kaufe den blau___ Pullover."</strong>',inp:'blank',ans:['en'],exp:'Akk. Mask., best. Artikel → <em>-en</em>.'},
{type:'mc',id:'g19',sub:'Adjektivendungen',q:'<strong>„Ich trinke ein___ kalt___ Wasser."</strong> (Akk. Neutr., unbest. Artikel)',opts:['ein / kaltes','einen / kalten','eine / kalte','ein / kalten'],ans:0,exp:'Akk. Neutr., unbest. → <em>ein kaltes Wasser</em>.'},
{type:'fill',id:'g20',sub:'Adjektivendungen',q:'Ergänze (Nom. Mask., unbest. Artikel):<br><strong>„Das ist ein gut___ Freund."</strong>',inp:'blank',ans:['er'],exp:'Nom. Mask., unbest. Artikel → <em>-er</em>.'},
{type:'mc',id:'g21',sub:'Adjektivendungen',q:'<strong>„Sie hat lang___ Haare." (Plural, kein Artikel)</strong>',opts:['e','en','er','es'],ans:0,exp:'Plural ohne Artikel Nom./Akk. → <em>-e</em>.'},
{type:'fill',id:'g22',sub:'Adjektivendungen',q:'Ergänze (Akk. Fem., unbest. Artikel):<br><strong>„Ich suche eine günstig___ Wohnung."</strong>',inp:'blank',ans:['e'],exp:'Akk. Fem., unbest. Artikel → <em>-e</em>.'},
{type:'mc',id:'g23',sub:'Komparativ',q:'Komparativ von <strong>„schnell"</strong>?',opts:['schneller','am schnellsten','schnellst','mehr schnell'],ans:0,exp:'Komparativ → <em>schneller</em>.'},
{type:'mc',id:'g24',sub:'Komparativ',q:'Komparativ von <strong>„gut"</strong>?',opts:['guter','gutter','besser','mehr gut'],ans:2,exp:'Unregelmäßig: <em>gut → besser</em>.'},
{type:'fill',id:'g25',sub:'Komparativ',q:'Ergänze den Komparativ:<br><strong>„Mein Bruder ist ___ als ich." (groß)</strong>',inp:'blank',ans:['größer'],exp:'<em>groß → größer</em> (mit Umlaut).'},
{type:'mc',id:'g26',sub:'Komparativ',q:'Superlativ von <strong>„hoch"</strong>?',opts:['am höher','am hochsten','am höchsten','höchst'],ans:2,exp:'<em>hoch → höher → am höchsten</em>.'},
{type:'fill',id:'g27',sub:'Komparativ',q:'Ergänze den Superlativ:<br><strong>„Der Mont Blanc ist ___ Berg der Alpen." (hoch, best. Artikel)</strong>',inp:'medium',ans:['der höchste'],exp:'<em>der höchste Berg</em>.'},
{type:'mc',id:'g28',sub:'Komparativ',q:'<strong>„viel"</strong> — Komparativ?',opts:['vieler','mehr','meiste','viele'],ans:1,exp:'Unregelmäßig: <em>viel → mehr → am meisten</em>.'},
{type:'mc',id:'g29',sub:'Komparativ',q:'Vergleich gleich: <strong>„Anna ist ___ groß ___ Tom."</strong>',opts:['so / wie','als / wie','wie / als','mehr / als'],ans:0,exp:'Gleichheit: <em>so … wie</em>.'},
{type:'fill',id:'g30',sub:'Komparativ',q:'Komparativ von <strong>„gern"</strong>:',inp:'blank',ans:['lieber'],exp:'Unregelmäßig: <em>gern → lieber → am liebsten</em>.'},
{type:'mc',id:'g31',sub:'Personalpronomen',q:'Akkusativ von <strong>„ich"</strong>?',opts:['mir','mich','ich','mein'],ans:1,exp:'Akkusativ → <em>mich</em>.'},
{type:'mc',id:'g32',sub:'Personalpronomen',q:'Dativ von <strong>„du"</strong>?',opts:['dich','dir','du','dein'],ans:1,exp:'Dativ → <em>dir</em>.'},
{type:'fill',id:'g33',sub:'Personalpronomen',q:'Ersetze durch ein Pronomen (Akk.):<br><strong>„Ich sehe den Mann." → „Ich sehe ___."</strong>',inp:'blank',ans:['ihn'],exp:'Maskulin Akk. → <em>ihn</em>.'},
{type:'fill',id:'g34',sub:'Personalpronomen',q:'Ersetze (Dativ):<br><strong>„Ich helfe der Frau." → „Ich helfe ___."</strong>',inp:'blank',ans:['ihr'],exp:'Feminin Dativ → <em>ihr</em>.'},
{type:'mc',id:'g35',sub:'Personalpronomen',q:'<strong>„Kannst du ___ helfen?" (ich)</strong>',opts:['mich','mir','ich','mein'],ans:1,exp:'<em>helfen</em> + Dativ → <em>mir</em>.'},
{type:'mc',id:'g36',sub:'Personalpronomen',q:'<strong>„Das Buch gehört ___." (wir)</strong>',opts:['uns','wir','unser','euch'],ans:0,exp:'<em>gehören</em> + Dativ → <em>uns</em>.'},
{type:'fill',id:'g37',sub:'Personalpronomen',q:'Ergänze (Akk., Plural sie):<br><strong>„Ich besuche meine Freunde. Ich besuche ___."</strong>',inp:'blank',ans:['sie'],exp:'Plural Akk. → <em>sie</em>.'},
{type:'mc',id:'g38',sub:'Demonstrativ',q:'<strong>„___ Auto da gefällt mir." (Nähe/Hinweis)</strong>',opts:['Dieses','Diese','Dieser','Diesen'],ans:0,exp:'Neutrum Nom. → <em>dieses Auto</em>.'},
{type:'mc',id:'g39',sub:'Demonstrativ',q:'<strong>„___ Frau kenne ich." (Akkusativ)</strong>',opts:['Dieser','Diese','Dieses','Diesen'],ans:1,exp:'Feminin Akk. → <em>diese Frau</em>.'},
{type:'fill',id:'g40',sub:'Negation',q:'Verneine mit <em>kein-</em>:<br><strong>„Ich habe ___ Zeit."</strong>',inp:'blank',ans:['keine'],exp:'Feminin Akk. → <em>keine Zeit</em>.'},
{type:'mc',id:'g41',sub:'Negation',q:'<strong>„Ich habe ___ Geld."</strong>',opts:['kein','keine','keinen','nicht'],ans:0,exp:'Neutrum Akk. → <em>kein Geld</em>.'},
{type:'mc',id:'g42',sub:'Negation',q:'Wann benutzt man <strong>„nicht"</strong> statt <em>kein</em>?',opts:['Vor Nomen mit Artikel','Bei Verben, Adjektiven, Eigennamen','Immer','Nie'],ans:1,exp:'<em>nicht</em> verneint Verben/Adjektive; <em>kein</em> verneint Nomen.'},
{type:'fill',id:'g43',sub:'Negation',q:'Verneine: <strong>„Ich kenne Berlin." → „Ich kenne Berlin ___."</strong>',inp:'blank',ans:['nicht'],exp:'Eigenname → <em>nicht</em>.'},
{type:'mc',id:'g44',sub:'Fragewörter',q:'<strong>„___ heißt du?"</strong>',opts:['Wer','Wie','Was','Wo'],ans:1,exp:'Nach dem Namen fragt man mit <em>Wie heißt du?</em>'},
{type:'mc',id:'g45',sub:'Fragewörter',q:'<strong>„___ kommst du? — Aus Spanien."</strong>',opts:['Wohin','Woher','Wo','Wann'],ans:1,exp:'Herkunft → <em>Woher</em>.'},
{type:'fill',id:'g46',sub:'Fragewörter',q:'Ergänze: <strong>„___ alt bist du?"</strong>',inp:'blank',ans:['wie'],exp:'<em>Wie alt …?</em>'},
{type:'mc',id:'g47',sub:'Fragewörter',q:'<strong>„___ gehst du? — Nach Hause."</strong>',opts:['Wo','Woher','Wohin','Wann'],ans:2,exp:'Richtung → <em>Wohin</em>.'},
{type:'mc',id:'g48',sub:'Plural',q:'Plural von <strong>„das Buch"</strong>?',opts:['die Buchs','die Bücher','die Buche','die Büchen'],ans:1,exp:'<em>das Buch → die Bücher</em>.'},
{type:'fill',id:'g49',sub:'Plural',q:'Plural von <strong>„die Frau"</strong>:',inp:'medium',ans:['die frauen'],exp:'<em>die Frau → die Frauen</em>.'},
{type:'mc',id:'g50',sub:'Plural',q:'Plural von <strong>„der Apfel"</strong>?',opts:['die Apfeln','die Äpfel','die Apfels','die Äpfeln'],ans:1,exp:'<em>der Apfel → die Äpfel</em> (Umlaut).'},
]},
{id:'verben',label:'Verben',num:'02',title:'Verben & Modalverben',exercises:[
{type:'mc',id:'v1',sub:'Modalverben',q:'<strong>„Ich ___ gut schwimmen."</strong>',opts:['kann','muss','darf','soll'],ans:0,exp:'Fähigkeit → <em>können</em>.'},
{type:'mc',id:'v2',sub:'Modalverben',q:'<strong>„Du ___ deine Hausaufgaben machen." (Pflicht)</strong>',opts:['kannst','darfst','musst','willst'],ans:2,exp:'Notwendigkeit → <em>müssen</em>.'},
{type:'fill',id:'v3',sub:'Modalverben',q:'Ergänze <em>möchten</em> (ich):<br><strong>„Ich ___ einen Kaffee."</strong>',inp:'blank',ans:['möchte'],exp:'<em>ich möchte</em>.'},
{type:'mc',id:'v4',sub:'Modalverben',q:'<strong>„Hier ___ man nicht rauchen." (Verbot)</strong>',opts:['kann','muss','darf','will'],ans:2,exp:'Verbot mit Negation → <em>darf nicht</em>.'},
{type:'fill',id:'v5',sub:'Modalverben',q:'Ergänze <em>wollen</em> (wir):<br><strong>„Wir ___ ins Kino gehen."</strong>',inp:'blank',ans:['wollen'],exp:'<em>wir wollen</em>.'},
{type:'mc',id:'v6',sub:'Modalverben',q:'<strong>„Du ___ mehr schlafen." (Empfehlung)</strong>',opts:['sollst','darfst','kannst','willst'],ans:0,exp:'Rat/Empfehlung → <em>sollen</em>.'},

const state={total:0,correct:0,answered:new Set()};
let currentSection=0;
const PAGE_SIZE=10;
let currentPage={};
function updateScore(){
  document.getElementById('scoreBadge').textContent=`${state.correct} / ${state.total} richtig`;
  const pct=state.total===0?0:Math.round(state.correct/state.total*100);
  document.getElementById('pctBadge').textContent=`${pct}% Trefferquote`;
  document.getElementById('pbar').style.width=(state.answered.size===0?0:Math.min(100,Math.round(state.answered.size/350*100)))+'%';
}
function buildTabs(){
  const bar=document.getElementById('tabBar');
  SECTIONS.forEach((sec,i)=>{
    const b=document.createElement('button');
    b.className='tab-btn'+(i===0?' active':'');
    b.innerHTML=`${sec.label} <span class="cnt">${sec.exercises.length}</span>`;
    b.onclick=()=>showSection(i);
    bar.appendChild(b);
  });
}
function showSection(idx){
  currentSection=idx;
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',i===idx));
  renderSection(idx);
  window.scrollTo({top:0,behavior:'smooth'});
}
function renderSection(idx){
  const sec=SECTIONS[idx];
  const mc=document.getElementById('mainContainer');
  if(!currentPage[idx])currentPage[idx]=0;
  const page=currentPage[idx];
  const exercises=sec.exercises;
  const totalPages=Math.ceil(exercises.length/PAGE_SIZE);
  const start=page*PAGE_SIZE;
  const slice=exercises.slice(start,start+PAGE_SIZE);
  const grouped={};
  slice.forEach(ex=>{if(!grouped[ex.sub])grouped[ex.sub]=[];grouped[ex.sub].push(ex);});
  let html=`<div class="sec-hdr" data-num="${sec.num}"><h2>${sec.title}</h2></div>`;
  html+=`<div class="pg-info">Seite ${page+1} von ${totalPages} · Übungen ${start+1}–${Math.min(start+PAGE_SIZE,exercises.length)} von ${exercises.length}</div>`;
  html+=`<div class="pg-btns">`;
  for(let p=0;p<totalPages;p++)html+=`<button class="pg-btn${p===page?' active-pg':''}" onclick="changePage(${idx},${p})">${p+1}</button>`;
  html+=`</div>`;
  Object.entries(grouped).forEach(([sub,exs])=>{
    html+=`<div class="subsec">${sub}</div>`;
    exs.forEach(ex=>{html+=renderExercise(ex);});
  });
  html+=`<div class="pg-btns" style="margin-top:2rem">`;
  if(page>0)html+=`<button class="pg-btn" onclick="changePage(${idx},${page-1})">← Zurück</button>`;
  if(page<totalPages-1)html+=`<button class="pg-btn" onclick="changePage(${idx},${page+1})">Weiter →</button>`;
  html+=`</div>`;
  mc.innerHTML=html;
}
function changePage(secIdx,page){
  currentPage[secIdx]=page;
  renderSection(secIdx);
  window.scrollTo({top:0,behavior:'smooth'});
}
function renderExercise(ex){
  const num=ex.id;
  const isDone=state.answered.has(num);
  let html=`<div class="card${isDone?' ok':''}" id="card-${num}"><span class="card-num">#${num.toUpperCase()}</span>`;
  html+=`<div class="prompt">${ex.q}</div>`;
  if(ex.type==='mc'){
    const letters=['A','B','C','D'];
    html+=`<div class="choices">`;
    ex.opts.forEach((opt,i)=>{
      let cls='';
      if(isDone&&i===ex.ans)cls='ok';
      html+=`<button class="opt${cls?' '+cls:''}" onclick="checkMC('${num}',${i},${ex.ans},'${(ex.exp||'').replace(/'/g,"\\'")}')"`+(isDone?' disabled':'')+`><span class="ltr">${letters[i]}</span>${opt}</button>`;
    });
    html+=`</div>`;
    if(isDone&&ex.exp)html+=`<div class="fb ok show"><i class="bi-check-circle-fill"></i> ${ex.exp}</div>`;
    else html+=`<div class="fb" id="fb-${num}"></div>`;
  } else if(ex.type==='fill'){
    const w=ex.inp==='blank'?'inp-sm':ex.inp==='medium'?'inp-md':'inp-lg';
    html+=`<div class="fill-row"><input class="inp ${w}" id="inp-${num}" placeholder="…"${isDone?' disabled':''}></div>`;
    if(!isDone)html+=`<button class="btn" onclick="checkFill('${num}')">Prüfen</button>`;
    html+=`<div class="fb" id="fb-${num}">${isDone?'<span style="color:var(--p)">Beantwortet.</span>':''}</div>`;
  } else if(ex.type==='transform'){
    html+=`<textarea class="inp" id="inp-${num}" placeholder="Antwort …"${isDone?' disabled':''}></textarea>`;
    if(ex.hint)html+=`<span class="hint-lnk" onclick="toggleHint('hint-${num}')"><i class="bi-search"></i> Tipp anzeigen</span><div class="hint-box" id="hint-${num}">${ex.hint}</div>`;
    if(!isDone)html+=`<button class="btn" onclick="checkTransform('${num}')">Prüfen</button>`;
    html+=`<div class="fb" id="fb-${num}">${isDone?'<span style="color:var(--p)">Beantwortet.</span>':''}</div>`;
  }
  html+=`</div>`;
  return html;
}
function checkMC(id,chosen,correct,exp){
  if(state.answered.has(id))return;
  state.answered.add(id);state.total++;
  const card=document.getElementById('card-'+id);
  card.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(i===correct)b.classList.add('ok');else if(i===chosen)b.classList.add('err');});
  const ok=chosen===correct;
  if(ok)state.correct++;
  const fb=document.getElementById('fb-'+id);
  if(fb){fb.innerHTML=ok?`<i class="bi-check-circle-fill"></i> Richtig! ${exp}`:`<i class="bi-x-circle-fill"></i> Falsch. Richtig: Option ${['A','B','C','D'][correct]}. ${exp}`;fb.className='fb '+(ok?'ok':'err')+' show';}
  card.classList.add(ok?'ok':'err');
  updateScore();
}
function findEx(id){for(const sec of SECTIONS)for(const ex of sec.exercises)if(ex.id===id)return ex;return null;}
function checkFill(id){
  if(state.answered.has(id))return;
  const ex=findEx(id);if(!ex)return;
  const inp=document.getElementById('inp-'+id);
  const val=inp.value.trim().toLowerCase();
  const ok=ex.ans.some(a=>val===a.toLowerCase()||val.replace(/\s+/g,' ')===a.toLowerCase());
  state.answered.add(id);state.total++;
  if(ok)state.correct++;
  inp.disabled=true;inp.classList.add(ok?'ok':'err');
  const card=document.getElementById('card-'+id);card.classList.add(ok?'ok':'err');
  const fb=document.getElementById('fb-'+id);
  fb.innerHTML=ok?`<i class="bi-check-circle-fill"></i> Richtig! ${ex.exp||''}`:`<i class="bi-x-circle-fill"></i> Falsch. Richtig: <strong>${ex.ans[0]}</strong>. ${ex.exp||''}`;
  fb.className='fb '+(ok?'ok':'err')+' show';
  updateScore();
}
function checkTransform(id){
  if(state.answered.has(id))return;
  const ex=findEx(id);if(!ex)return;
  const ta=document.getElementById('inp-'+id);
  const val=ta.value.trim().toLowerCase();
  if(!val){const fb=document.getElementById('fb-'+id);fb.innerHTML='<i class="bi-exclamation-triangle-fill"></i> Bitte einen Satz eingeben.';fb.className='fb err show';return;}
  const ok=ex.keys.every(k=>val.includes(k.toLowerCase()));
  state.answered.add(id);state.total++;
  if(ok)state.correct++;
  ta.disabled=true;ta.classList.add(ok?'ok':'err');
  const card=document.getElementById('card-'+id);card.classList.add(ok?'ok':'err');
  const fb=document.getElementById('fb-'+id);
  fb.innerHTML=ok?`<i class="bi-check-circle-fill"></i> Gut! Enthält die wesentlichen Elemente.`:`<i class="bi-x-circle-fill"></i> Überprüfe deine Antwort. Tipp: ${ex.hint||''}`;
  fb.className='fb '+(ok?'ok':'err')+' show';
  updateScore();
}
function toggleHint(id){const h=document.getElementById(id);if(h)h.classList.toggle('show');}
buildTabs();
renderSection(0);
</script>
