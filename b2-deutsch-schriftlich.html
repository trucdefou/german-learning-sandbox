<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B2 Deutsch — 350 Übungen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
/* Tiya Golf Club inspired palette */
:root{
  --white:#ffffff;
  --primary:#81B29A;
  --secondary:#3D405B;
  --section-bg:#F4F1DE;
  --btn-bg:#F2CC8F;
  --btn-hover:#E07A5F;
  --dark:#000000;
  --p:#717275;
  --link-hover:#F2CC8F;
  --ok:#5aab8a;
  --err:#c96060;
  --brd:#e8e3d0;
  --font:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--white);color:var(--p);font-family:var(--font);font-weight:400;min-height:100vh;line-height:1.65}
header{border-bottom:1px solid var(--brd);padding:1.8rem 2.5rem 1.5rem;display:flex;justify-content:space-between;align-items:flex-end;position:sticky;top:0;z-index:100;background:rgba(255,255,255,.95);backdrop-filter:blur(12px)}
.h-left h1{font-family:var(--font);font-size:1.9rem;color:var(--secondary);font-weight:700;letter-spacing:-1px}
.h-left span{font-size:.7rem;color:var(--primary);letter-spacing:.15em;text-transform:uppercase;display:block;margin-bottom:.3rem;font-weight:500}
.score-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:.4rem}
.score-badge{font-size:.85rem;color:var(--white);background:var(--primary);padding:.4rem 1.1rem;border-radius:100px;letter-spacing:.03em;font-weight:500}
.pct-badge{font-size:.75rem;color:var(--p);letter-spacing:.03em}
.tabs{display:flex;flex-wrap:wrap;gap:.5rem;padding:1rem 2.5rem .9rem;background:var(--section-bg);position:sticky;top:88px;z-index:90;border-bottom:1px solid var(--brd)}
.tab-btn{background:var(--white);border:1px solid var(--brd);color:var(--secondary);font-family:var(--font);font-size:.72rem;letter-spacing:.05em;padding:.45rem 1rem;cursor:pointer;border-radius:100px;text-transform:uppercase;font-weight:500;transition:all .2s}
.tab-btn:hover,.tab-btn.active{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--secondary)}
.tab-btn .cnt{display:inline-block;background:rgba(61,64,91,.08);border-radius:100px;padding:0 .5rem;margin-left:.4rem;font-size:.65rem;color:var(--secondary)}
.tab-btn.active .cnt{background:rgba(61,64,91,.2);color:var(--secondary)}
.container{max-width:860px;margin:0 auto;padding:2.5rem 1.5rem 7rem}
.sec-hdr{display:flex;align-items:center;gap:1rem;margin:2.5rem 0 1.2rem}
.sec-hdr::before{content:attr(data-num);font-size:.7rem;color:var(--white);background:var(--secondary);padding:.3rem .75rem;border-radius:100px;letter-spacing:.05em;white-space:nowrap;font-weight:500}
.sec-hdr h2{font-family:var(--font);font-size:1.5rem;color:var(--secondary);font-weight:700;letter-spacing:-.5px}
.sec-hdr::after{content:'';flex:1;height:1px;background:linear-gradient(to right,var(--brd),transparent)}
.subsec{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--primary);margin:2rem 0 .8rem;padding-left:.7rem;border-left:3px solid var(--primary);font-weight:500}
.card{background:var(--white);border:1px solid var(--brd);border-left:4px solid transparent;border-radius:20px;padding:1.4rem 1.6rem;margin-bottom:1rem;transition:border-color .2s,box-shadow .2s;position:relative;box-shadow:0 2px 6px rgba(61,64,91,.04)}
.card:hover{border-left-color:var(--primary);box-shadow:0 4px 16px rgba(61,64,91,.08)}
.card.ok{border-left-color:var(--ok)}
.card.err{border-left-color:var(--err)}
.card-num{font-size:.7rem;color:var(--p);position:absolute;top:.8rem;right:1rem;background:var(--section-bg);padding:.18rem .6rem;border-radius:100px}
.prompt{font-size:.95rem;color:var(--secondary);margin-bottom:1rem;line-height:1.75}
.prompt em{color:var(--primary);font-style:normal;font-weight:500}
.prompt strong{color:var(--btn-hover);font-weight:700}
.choices{display:grid;gap:.5rem}
.opt{background:var(--section-bg);border:1px solid var(--brd);color:var(--secondary);font-family:var(--font);font-size:.9rem;padding:.7rem 1rem;text-align:left;cursor:pointer;border-radius:10px;transition:all .15s;display:flex;align-items:flex-start;gap:.7rem}
.opt:hover:not(:disabled){background:var(--white);color:var(--secondary);border-color:var(--primary)}
.opt .ltr{font-family:var(--font);font-size:.78rem;color:var(--primary);min-width:1rem;flex-shrink:0;margin-top:.1rem;font-weight:700}
.opt.ok{background:rgba(129,178,154,.15);border-color:var(--ok);color:#2d6a4f}
.opt.err{background:rgba(224,122,95,.12);border-color:var(--err);color:#a04545}
.opt:disabled{cursor:default}
.inp{background:var(--white);border:1px solid var(--brd);color:var(--secondary);font-family:var(--font);font-size:.9rem;padding:.55rem .9rem;border-radius:10px;outline:none;transition:border-color .2s;margin-top:.2rem}
.inp:focus{border-color:var(--primary)}
.inp.ok{border-color:var(--ok);color:#2d6a4f}
.inp.err{border-color:var(--err);color:#a04545}
.inp-sm{width:140px}.inp-md{width:220px}.inp-lg{width:100%}
textarea.inp{width:100%;min-height:70px;resize:vertical;font-family:var(--font);line-height:1.6}
.btn{background:var(--btn-bg);border:none;color:var(--secondary);font-family:var(--font);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;padding:.55rem 1.2rem;cursor:pointer;border-radius:100px;margin-top:.8rem;font-weight:700;transition:all .2s}
.btn:hover{background:var(--btn-hover);color:var(--white)}
.fb{margin-top:.7rem;font-size:.87rem;padding:.6rem .95rem;border-radius:10px;display:none;line-height:1.55}
.fb.show{display:block}
.fb.ok{background:rgba(129,178,154,.12);color:#2d6a4f;border-left:3px solid var(--ok)}
.fb.err{background:rgba(224,122,95,.1);color:#a04545;border-left:3px solid var(--err)}
.hint-lnk{font-size:.78rem;color:var(--primary);cursor:pointer;margin-top:.5rem;display:inline-block;transition:color .2s;font-weight:500}
.hint-lnk:hover{color:var(--btn-hover)}
.hint-box{display:none;font-size:.85rem;color:var(--secondary);background:rgba(129,178,154,.08);padding:.5rem .85rem;border-left:3px solid var(--primary);border-radius:0 10px 10px 0;margin-top:.5rem;font-style:italic;line-height:1.55}
.hint-box.show{display:block}
.fill-row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-top:.3rem}
.pg-info{font-size:.75rem;color:var(--p);text-align:center;margin:1.5rem 0 .5rem;letter-spacing:.05em}
.pg-btns{display:flex;gap:.5rem;justify-content:center;margin-bottom:1rem;flex-wrap:wrap}
.pg-btn{background:var(--white);border:1px solid var(--brd);color:var(--secondary);font-family:var(--font);font-size:.75rem;padding:.4rem .9rem;cursor:pointer;border-radius:100px;transition:all .15s;font-weight:500}
.pg-btn:hover{border-color:var(--primary);color:var(--primary)}
.pg-btn.active-pg{background:var(--primary);border-color:var(--primary);color:var(--white)}
.pbar-wrap{position:fixed;bottom:0;left:0;right:0;height:4px;background:var(--section-bg);z-index:200}
.pbar{height:100%;background:linear-gradient(to right,var(--primary),var(--btn-bg));width:0%;transition:width .4s}
.fb i[class^="bi-"],.hint-lnk i[class^="bi-"]{margin-right:.3rem;font-size:.95em;vertical-align:-.05em}
@media(max-width:600px){header{padding:1.2rem 1rem;flex-direction:column;align-items:flex-start;gap:.8rem}.tabs{padding:.8rem 1rem;top:auto;position:relative}.container{padding:1.5rem 1rem 5rem}.card{padding:1.2rem}}
</style>
</head>
<body>
<header>
  <div class="h-left">
    <span>Prüfungsvorbereitung · 350 Übungen</span>
    <h1>Deutsches B2 — Komplettheft</h1>
  </div>
  <div class="score-wrap">
    <div class="score-badge" id="scoreBadge">0 / 0 richtig</div>
    <div class="pct-badge" id="pctBadge">—% Trefferquote</div>
  </div>
</header>
<div class="tabs" id="tabBar"></div>
<div class="container" id="mainContainer"></div>
<div class="pbar-wrap"><div class="pbar" id="pbar"></div></div>
<script>
const SECTIONS=[
{id:'grammatik',label:'Grammatik',num:'01',title:'Grammatik & Satzstrukturen',exercises:[
{type:'mc',id:'g1',sub:'Relativsätze',q:'Wähle das richtige Relativpronomen:<br><strong>„Das ist der Mann, ___ ich gestern getroffen habe."</strong>',opts:['den','dem','der','dessen'],ans:0,exp:'Akkusativ, Maskulinum → <em>den</em>.'},
{type:'mc',id:'g2',sub:'Relativsätze',q:'<strong>„Das ist die Frau, ___ Sohn Arzt ist."</strong>',opts:['die','deren','der','derer'],ans:1,exp:'Genitiv, Feminin → <em>deren</em>.'},
{type:'mc',id:'g3',sub:'Relativsätze',q:'<strong>„Das Buch, ___ ich gelesen habe, war interessant."</strong>',opts:['das','dem','dessen','die'],ans:0,exp:'Akkusativ, Neutrum → <em>das</em>.'},
{type:'mc',id:'g4',sub:'Relativsätze',q:'<strong>„Die Leute, ___ hier wohnen, sind freundlich."</strong>',opts:['die','denen','deren','das'],ans:0,exp:'Plural Nominativ → <em>die</em>.'},
{type:'fill',id:'g5',sub:'Relativsätze',q:'Ergänze: <strong>„Der Kollege, ___ ich geholfen habe, bedankte sich."</strong>',inp:'blank',ans:['dem'],exp:'Dativ, Maskulinum → <em>dem</em>.'},
{type:'fill',id:'g6',sub:'Relativsätze',q:'Ergänze: <strong>„Das Thema, über ___ wir diskutiert haben, war komplex."</strong>',inp:'blank',ans:['das'],exp:'Präposition <em>über</em> + Akkusativ, Neutrum → <em>das</em>.'},
{type:'mc',id:'g7',sub:'Relativsätze',q:'<strong>„Die Studenten, ___ Prüfungen morgen sind, sind nervös."</strong>',opts:['die','deren','denen','das'],ans:1,exp:'Genitiv Plural → <em>deren</em>.'},
{type:'mc',id:'g8',sub:'Relativsätze',q:'<strong>„Alles, ___ er sagte, war falsch."</strong>',opts:['das','was','die','dem'],ans:1,exp:'Nach <em>alles</em> steht <em>was</em> (nicht das).'},
{type:'fill',id:'g9',sub:'Adjektivdeklination',q:'Ergänze die Endung (Nom. Mask., bestimmter Artikel):<br><strong>„Der alt___ Mann geht spazieren."</strong>',inp:'blank',ans:['e'],exp:'Nom. Mask., bestimmter Artikel → <em>-e</em>.'},
{type:'fill',id:'g10',sub:'Adjektivdeklination',q:'Ergänze (Akk. Mask., bestimmter Artikel):<br><strong>„Ich sehe den jung___ Mann."</strong>',inp:'blank',ans:['en'],exp:'Akk. Mask., bestimmter Artikel → <em>-en</em>.'},
{type:'fill',id:'g11',sub:'Adjektivdeklination',q:'Ergänze (Nom. Fem., bestimmter Artikel):<br><strong>„Die neu___ Kollegin ist nett."</strong>',inp:'blank',ans:['e'],exp:'Nom. Fem., best. Artikel → <em>-e</em>.'},
{type:'fill',id:'g12',sub:'Adjektivdeklination',q:'Ergänze (Nom. Mask., unbestimmter Artikel):<br><strong>„Ein alt___ Mann wohnt hier."</strong>',inp:'blank',ans:['er'],exp:'Nom. Mask., unbest. Artikel → <em>-er</em>.'},
{type:'fill',id:'g13',sub:'Adjektivdeklination',q:'Ergänze (Akk. Fem., unbestimmter Artikel):<br><strong>„Ich suche eine günstig___ Wohnung."</strong>',inp:'blank',ans:['e'],exp:'Akk. Fem., unbest. Artikel → <em>-e</em>.'},
{type:'mc',id:'g14',sub:'Adjektivdeklination',q:'<strong>„Mit freundlich___ Grüßen"</strong> (Dativ Pl., kein Artikel)',opts:['en','e','er','em'],ans:0,exp:'Dativ Plural, kein Artikel → <em>-en</em>.'},
{type:'fill',id:'g15',sub:'Adjektivdeklination',q:'Ergänze (Gen. Neutr., bestimmter Artikel):<br><strong>„Das ist das Ergebnis des lang___ Experiments."</strong>',inp:'blank',ans:['en'],exp:'Gen. Neutr., best. Artikel → <em>-en</em>.'},
{type:'mc',id:'g16',sub:'Adjektivdeklination',q:'<strong>„Kalter Kaffee"</strong> — Welche Deklination?',opts:['stark (kein Artikel)','schwach (best. Art.)','gemischt (unbest. Art.)','keine Deklination'],ans:0,exp:'Ohne Artikel → starke Deklination: <em>kalter Kaffee</em>.'},
{type:'mc',id:'g17',sub:'Präpositionen',q:'Welche Präposition + Kasus ist korrekt?<br><strong>„Er wartet ___ seine Schwester."</strong>',opts:['für (Akk.)','auf (Akk.)','nach (Dat.)','bei (Dat.)'],ans:1,exp:'<em>warten auf</em> + Akkusativ.'},
{type:'mc',id:'g18',sub:'Präpositionen',q:'<strong>„Sie interessiert sich ___ Musik."</strong>',opts:['an (Dat.)','über (Akk.)','für (Akk.)','bei (Dat.)'],ans:2,exp:'<em>sich interessieren für</em> + Akkusativ.'},
{type:'fill',id:'g19',sub:'Präpositionen',q:'Ergänze mit korrekter Präposition:<br><strong>„Er denkt oft ___ seine Kindheit."</strong>',inp:'blank',ans:['an'],exp:'<em>denken an</em> + Akkusativ.'},
{type:'fill',id:'g20',sub:'Präpositionen',q:'Ergänze: <strong>„Sie freut sich ___ das Geschenk."</strong>',inp:'blank',ans:['über','auf'],exp:'<em>sich freuen über</em> (Gegenwart) oder <em>auf</em> (Zukunft).'},
{type:'mc',id:'g21',sub:'Präpositionen',q:'Lokal — wo?<br><strong>„Das Buch liegt ___ dem Tisch."</strong>',opts:['auf','über','an','in'],ans:0,exp:'Lage (Dat.) → <em>auf dem Tisch</em>.'},
{type:'mc',id:'g22',sub:'Präpositionen',q:'Direktional — wohin?<br><strong>„Leg das Buch ___ den Tisch."</strong>',opts:['auf','an','in','über'],ans:0,exp:'Richtung (Akk.) → <em>auf den Tisch</em>.'},
{type:'mc',id:'g23',sub:'Zeitformen',q:'Welche Zeitform drückt abgeschlossene Handlung mit Gegenwartsbezug aus?',opts:['Präteritum','Plusquamperfekt','Perfekt','Futur I'],ans:2,exp:'Das <em>Perfekt</em> verbindet Vergangenheit mit Gegenwartsbezug.'},
{type:'fill',id:'g24',sub:'Zeitformen',q:'Bilde das Plusquamperfekt:<br><strong>„Als er ankam, ___ sie schon ___." (gehen)</strong>',inp:'blank',ans:['war','gegangen'],exp:'Plusquamperfekt: <em>war … gegangen</em>.'},
{type:'mc',id:'g25',sub:'Zeitformen',q:'Futur II — welcher Satz ist richtig?',opts:['Morgen werde ich schlafen.','Bis morgen wird er es gemacht haben.','Er hat es morgen gemacht.','Bis morgen hat er es machen.'],ans:1,exp:'Futur II: <em>wird + Partizip II + haben/sein</em>.'},
{type:'fill',id:'g26',sub:'Zeitformen',q:'Präteritum von <em>wissen</em> (1. Sg.):<br><strong>„Ich ___ es nicht."</strong>',inp:'blank',ans:['wusste'],exp:'<em>wissen</em> → Prät. → <em>wusste</em>.'},
{type:'fill',id:'g27',sub:'Zeitformen',q:'Präteritum von <em>können</em> (3. Sg.):<br><strong>„Er ___ nicht kommen."</strong>',inp:'blank',ans:['konnte'],exp:'<em>können</em> → Prät. → <em>konnte</em>.'},
{type:'mc',id:'g28',sub:'Zeitformen',q:'Welche Form ist das Futur I von <em>arbeiten</em> (wir)?',opts:['Wir arbeiten','Wir werden arbeiten','Wir haben gearbeitet','Wir arbeiteten'],ans:1,exp:'Futur I: <em>werden + Infinitiv</em>.'},
{type:'fill',id:'g29',sub:'Zeitformen',q:'Perfekt von <em>einschlafen</em> (er):<br><strong>„Er ___ schnell ___."</strong>',inp:'blank',ans:['ist','eingeschlafen'],exp:'Zustandsveränderung → <em>sein</em> + Partizip II: <em>ist eingeschlafen</em>.'},
{type:'mc',id:'g30',sub:'Zeitformen',q:'Welches Verb bildet das Perfekt mit <em>sein</em>?',opts:['kaufen','bauen','reisen','fragen'],ans:2,exp:'<em>reisen</em> = Bewegung → <em>ist gereist</em>.'},
{type:'mc',id:'g31',sub:'Infinitivkonstruktionen',q:'<strong>„Er beschloss, früher ___ kommen."</strong>',opts:['zu','—','dass','um … zu'],ans:0,exp:'Infinitiv mit <em>zu</em> nach Verb des Entschlusses.'},
{type:'mc',id:'g32',sub:'Infinitivkonstruktionen',q:'Finaler Infinitiv — welcher Satz ist richtig?',opts:['Er lernt Deutsch, um in Deutschland zu arbeiten.','Er lernt Deutsch, zu in Deutschland arbeiten.','Er lernt Deutsch, dass er zu arbeiten.','Er lernt Deutsch um arbeiten.'],ans:0,exp:'<em>um … zu + Infinitiv</em> für Zweck/Ziel.'},
{type:'mc',id:'g33',sub:'Infinitivkonstruktionen',q:'<strong>„Anstatt ___ fernsehen, liest er."</strong>',opts:['zu','—','um','ohne'],ans:0,exp:'<em>anstatt zu</em> + Infinitiv.'},
{type:'fill',id:'g34',sub:'Infinitivkonstruktionen',q:'Ergänze: <strong>„Sie vergaß, die Tür ___ schließen."</strong>',inp:'blank',ans:['zu'],exp:'Infinitiv mit <em>zu</em> nach Verben des Vergessens.'},
{type:'fill',id:'g35',sub:'Infinitivkonstruktionen',q:'Ergänze: <strong>„Er trainiert täglich, ___ fitter ___ werden."</strong>',inp:'blank',ans:['um','zu'],exp:'<em>um … zu + Infinitiv</em>.'},
{type:'mc',id:'g36',sub:'Satzstellung',q:'Welche Satzstellung ist korrekt bei Inversion?<br><strong>„Gestern ___ er ins Kino."</strong>',opts:['ging er','er ging','er ist gegangen','ging'],ans:0,exp:'Bei Inversion: Verb auf Pos. 2 → <em>Gestern ging er</em>.'},
{type:'mc',id:'g37',sub:'Satzstellung',q:'Nebensatz — Verbstellung:<br><strong>„Ich weiß, dass er morgen ___."</strong>',opts:['kommt','er kommt','kommen wird','wird kommen'],ans:0,exp:'Im Nebensatz steht das Verb am Ende: <em>kommt</em>.'},
{type:'mc',id:'g38',sub:'Satzstellung',q:'TE-KA-MO-LO — welche Reihenfolge ist korrekt?<br><strong>„Er fährt ___ nach Berlin."</strong>',opts:['morgen mit dem Zug','mit dem Zug morgen','morgen schnell','mit dem Zug gestern schnell'],ans:0,exp:'Te→Mo→Lo: <em>morgen (Te) mit dem Zug (Mo) nach Berlin (Lo)</em>.'},
{type:'mc',id:'g39',sub:'Satzstellung',q:'Trennbares Verb im Nebensatz:<br><strong>„Er sagt, dass er früh ___."</strong>',opts:['aufsteht','steht auf','auf steht','aufgestanden'],ans:0,exp:'Trennbares Verb bleibt im Nebensatz zusammen: <em>aufsteht</em>.'},
{type:'fill',id:'g40',sub:'Satzstellung',q:'Stelle um (Inversion):<br><strong>„Leider ___ sie keine Zeit."</strong>',inp:'blank',ans:['hat'],exp:'Inversion: <em>Leider hat sie …</em>'},
{type:'mc',id:'g41',sub:'Satzstellung',q:'Modalverb im Nebensatz:<br><strong>„…, weil er nicht schlafen ___."</strong>',opts:['kann','könnte','kann nicht','nicht kann'],ans:0,exp:'Modalverb ans Ende: <em>…schlafen kann</em>.'},
{type:'mc',id:'g42',sub:'Satzstellung',q:'Korrekter Satz mit Reflexivverb?',opts:['Er sich erinnert nicht.','Er erinnert sich nicht.','Sich er erinnert nicht.','Er nicht sich erinnert.'],ans:1,exp:'<em>Er erinnert sich nicht.</em>'},
{type:'mc',id:'g43',sub:'Genitiv',q:'Welche Genitivkonstruktion ist korrekt?',opts:['das Haus von dem Lehrer','das Haus des Lehrers','dem Lehrer sein Haus','das Lehrer Haus'],ans:1,exp:'Genitiv maskulin: <em>des Lehrers</em>.'},
{type:'fill',id:'g44',sub:'Genitiv',q:'Ergänze im Genitiv:<br><strong>„Das ist das Büro ___ Direktorin."</strong>',inp:'blank',ans:['der'],exp:'Genitiv feminin: <em>der Direktorin</em>.'},
{type:'mc',id:'g45',sub:'Kasus',q:'Welches Verb regiert den Dativ?',opts:['besuchen','danken','kaufen','finden'],ans:1,exp:'<em>danken + Dativ</em>: Ich danke dir.'},
{type:'mc',id:'g46',sub:'Kasus',q:'<strong>„Er hilft ___ alten Mann."</strong>',opts:['den','dem','der','des'],ans:1,exp:'<em>helfen + Dativ</em>, mask. → <em>dem</em>.'},
{type:'fill',id:'g47',sub:'Kasus',q:'Ergänze (Dativ feminin nach <em>mit</em>):<br><strong>„Er kommt mit ___ Schwester."</strong>',inp:'blank',ans:['seiner','der'],exp:'<em>mit</em> + Dativ: <em>mit seiner Schwester</em>.'},
{type:'mc',id:'g48',sub:'Kasus',q:'Welcher Kasus folgt auf <em>wegen</em>?',opts:['Akkusativ','Nominativ','Genitiv','Dativ'],ans:2,exp:'<em>wegen</em> + Genitiv: wegen des Regens.'},
{type:'mc',id:'g49',sub:'Kasus',q:'<strong>„trotz"</strong> regiert welchen Kasus?',opts:['Akkusativ','Dativ','Genitiv','Nominativ'],ans:2,exp:'<em>trotz</em> + Genitiv: trotz des Regens.'},
{type:'mc',id:'g50',sub:'Kasus',q:'Welches Verb verlangt Akkusativ?',opts:['helfen','danken','begegnen','kaufen'],ans:3,exp:'<em>kaufen</em> + Akkusativ: Ich kaufe das Buch.'},
]},
{id:'wortschatz',label:'Wortschatz',num:'02',title:'Wortschatz & Lexik',exercises:[

{type:'mc',id:'kon38',sub:'Zweiteilige Konnektoren',q:'<strong>„___ er ___ seine Frau sind Ärzte."</strong> (beide)',opts:['Weder … noch','Entweder … oder','Sowohl … als auch','Nicht nur … sondern'],ans:2,exp:'<em>Sowohl … als auch</em>.'},
{type:'mc',id:'kon39',sub:'Zweiteilige Konnektoren',q:'Alternative:<br><strong>„___ du kommst, ___ er bleibt."</strong>',opts:['Sowohl … als auch','Entweder … oder','Weder … noch','Zwar … aber'],ans:1,exp:'<em>Entweder … oder</em>.'},

]},
{id:'leseverstehen',label:'Leseverstehen',num:'06',title:'Leseverstehen',exercises:[
{type:'mc',id:'lv1',sub:'Text A — Digitalisierung',q:'<em>„Die Digitalisierung verändert unsere Gesellschaft. Schulen setzen auf Lernplattformen. Befürworter: digitale Medien gestalten Unterricht individueller. Kritiker: Bildschirmzeit schwächt soziale Kompetenzen. Ohne Lehrerfortbildungen bleiben Geräte wirkungslos."</em><br><br>Vorteile laut Befürwortern?',opts:['Günstigere Schulen','Individualisierterer Unterricht','Keine Lehrer nötig','Schnelleres Internet'],ans:1,exp:'Befürworter sehen <em>individuelleren Unterricht</em>.'},
{type:'mc',id:'lv2',sub:'Text A — Digitalisierung',q:'Voraussetzung für wirksame Digitalisierung?',opts:['Neue Schulgebäude','Abschaffung von Büchern','Lehrerfortbildungen','Günstige Tablets'],ans:2,exp:'<em>Ohne Fortbildungen bleiben Geräte wirkungslos.</em>'},
{type:'mc',id:'lv3',sub:'Text A — Digitalisierung',q:'Was bedeutet <strong>„wirkungslos"</strong>?',opts:['sehr teuer','ohne Wirkung','kompliziert','modern'],ans:1,exp:'<em>wirkungslos</em> = ohne Wirkung.'},
{type:'mc',id:'lv4',sub:'Text A — Digitalisierung',q:'Welche Aussage ist NICHT im Text?',opts:['Kritiker fürchten Verlust sozialer Kompetenzen.','Befürworter sehen Vorteile.','Alle Länder haben Digitalisierung umgesetzt.','Lernplattformen werden mehr genutzt.'],ans:2,exp:'Über vollständige Umsetzung wird nicht gesprochen.'},
{type:'mc',id:'lv5',sub:'Text A — Digitalisierung',q:'Was impliziert der letzte Satz?',opts:['Geräte sind unwichtig.','Schulung ist entscheidend für Wirkung.','Schulen sollen keine Geräte kaufen.','Fortbildungen sind unnötig.'],ans:1,exp:'Ohne Fortbildungen sind Geräte nutzlos.'},
{type:'mc',id:'lv6',sub:'Text B — Arbeitsmarkt',q:'<em>„Automatisierung und KI werden den Arbeitsmarkt umgestalten. Routinetätigkeiten werden von Maschinen übernommen. Neue Berufsfelder erfordern kreative und soziale Kompetenzen. Lebenslanges Lernen wird Notwendigkeit."</em><br><br>Was übernehmen Maschinen?',opts:['Kreative Aufgaben','Soziale Tätigkeiten','Routinetätigkeiten','Führungsaufgaben'],ans:2,exp:'<em>Routinetätigkeiten</em>.'},
{type:'mc',id:'lv7',sub:'Text B — Arbeitsmarkt',q:'Welche Kompetenzen werden wichtiger?',opts:['Handwerkliche','Kreative und soziale','Körperliche Stärke','Gedächtnis'],ans:1,exp:'<em>kreative und soziale Kompetenzen</em>.'},
{type:'mc',id:'lv8',sub:'Text B — Arbeitsmarkt',q:'Was bedeutet „lebenslanges Lernen"?',opts:['Bis Schulabschluss','Kontinuierliche Weiterbildung im Berufsleben','Nur in jungen Jahren','Als Hobby'],ans:1,exp:'Weiterbildung über das gesamte Berufsleben.'},
{type:'mc',id:'lv9',sub:'Text B — Arbeitsmarkt',q:'Synonym für <strong>„umgestalten"</strong>?',opts:['zerstören','transformieren / verändern','ignorieren','beschleunigen'],ans:1,exp:'<em>umgestalten</em> = verändern.'},
{type:'mc',id:'lv10',sub:'Text B — Arbeitsmarkt',q:'Ton des Textes?',opts:['Alarmierend','Sachlich-informierend','Humorvoll','Stark kritisch'],ans:1,exp:'Sachlich-informierend.'},
{type:'mc',id:'lv11',sub:'Text C — Klimawandel',q:'<em>„Der Klimawandel zählt zu den größten Herausforderungen. Steigende Temperaturen, Extremwetter und Meeresspiegel-Anstieg bedrohen Ökosysteme. Wissenschaftler fordern dringende Maßnahmen. Einzelne Länder haben ehrgeizige Klimaziele gesetzt."</em><br><br>Folgen des Klimawandels?',opts:['Sinkende Temperaturen','Steigende Temperaturen, Extremwetter, Meeresspiegel','Wirtschaftlicher Aufschwung','Mehr Biodiversität'],ans:1,exp:'<em>steigende Temperaturen, Extremwetter, Meeresspiegel-Anstieg</em>.'},
{type:'mc',id:'lv12',sub:'Text C — Klimawandel',q:'Was fordern Wissenschaftler?',opts:['Mehr Forschung ohne Maßnahmen','Dringende Reduzierung von Treibhausgasemissionen','Verlagerung von Industrie','Abschaffung aller Autos'],ans:1,exp:'<em>dringende Maßnahmen zur Reduzierung</em>.'},

{type:'mc',id:'lv16',sub:'Text D — Gesundheit',q:'<em>„Studien zeigen: Obst, Gemüse, Hülsenfrüchte senken Krankheitsrisiko. Verarbeitete Lebensmittel stehen im Verdacht, Herz-Kreislauf-Erkrankungen zu begünstigen. Experten empfehlen Mittelmeerdiät."</em><br><br>Was senkt das Krankheitsrisiko?',opts:['Verarbeitete Lebensmittel','Obst, Gemüse und Hülsenfrüchte','Fleischkonsum','Fastfood'],ans:1,exp:'<em>Obst, Gemüse und Hülsenfrüchte</em>.'},
{type:'mc',id:'lv17',sub:'Text D — Gesundheit',q:'Was wird mit Herz-Kreislauf-Erkrankungen verbunden?',opts:['Mittelmeerdiät','Obst','Stark verarbeitete Lebensmittel','Hülsenfrüchte'],ans:2,exp:'<em>Stark verarbeitete Lebensmittel</em>.'},
{type:'mc',id:'lv18',sub:'Text D — Gesundheit',q:'Was bedeutet <strong>„im Verdacht stehen"</strong>?',opts:['Als sicher bewiesen','Als möglicherweise schädlich angesehen','Als unbedenklich','Bekannt sein'],ans:1,exp:'<em>im Verdacht stehen</em> = möglicherweise schädlich (nicht bewiesen).'},

{type:'mc',id:'lv20',sub:'Text D — Gesundheit',q:'Was bedeutet <strong>„ausgewogen"</strong>?',opts:['sehr teuer','gleichgewichtig / verschiedene Nährstoffe','schnell zubereitet','sehr lecker'],ans:1,exp:'<em>ausgewogen</em> = verschiedene Nährstoffe.'},

{type:'mc',id:'lv22',sub:'Wortschatz im Kontext',q:'<em>„Das Projekt scheiterte."</em> Was bedeutet <strong>„scheitern"</strong>?',opts:['erfolgreich sein','stocken','misslingen','verzögert werden'],ans:2,exp:'<em>scheitern</em> = misslingen.'},
{type:'mc',id:'lv23',sub:'Wortschatz im Kontext',q:'<em>„Die Verhandlungen wurden vertagt."</em> Was bedeutet <strong>„vertagen"</strong>?',opts:['abgebrochen','auf später verschoben','beschleunigt','beendet'],ans:1,exp:'<em>vertagen</em> = auf späteren Termin verschieben.'},

];
const state={total:0,correct:0,answered:new Set()};
let currentSection=0;
const PAGE_SIZE=10;
let currentPage={};
function updateScore(){
  document.getElementById('scoreBadge').textContent=`${state.correct} / ${state.total} richtig`;
  const pct=state.total===0?0:Math.round(state.correct/state.total*100);
  document.getElementById('pctBadge').textContent=`${pct}% Trefferquote`;
  document.getElementById('pbar').style.width=(state.answered.size===0?0:Math.min(100,Math.round(state.answered.size/350*100)))+'%';
}
function buildTabs(){
  const bar=document.getElementById('tabBar');
  SECTIONS.forEach((sec,i)=>{
    const b=document.createElement('button');
    b.className='tab-btn'+(i===0?' active':'');
    b.innerHTML=`${sec.label} <span class="cnt">${sec.exercises.length}</span>`;
    b.onclick=()=>showSection(i);
    bar.appendChild(b);
  });
}
function showSection(idx){
  currentSection=idx;
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',i===idx));
  renderSection(idx);
  window.scrollTo({top:0,behavior:'smooth'});
}
function renderSection(idx){
  const sec=SECTIONS[idx];
  const mc=document.getElementById('mainContainer');
  if(!currentPage[idx])currentPage[idx]=0;
  const page=currentPage[idx];
  const exercises=sec.exercises;
  const totalPages=Math.ceil(exercises.length/PAGE_SIZE);
  const start=page*PAGE_SIZE;
  const slice=exercises.slice(start,start+PAGE_SIZE);
  const grouped={};
  slice.forEach(ex=>{if(!grouped[ex.sub])grouped[ex.sub]=[];grouped[ex.sub].push(ex);});
  let html=`<div class="sec-hdr" data-num="${sec.num}"><h2>${sec.title}</h2></div>`;
  html+=`<div class="pg-info">Seite ${page+1} von ${totalPages} · Übungen ${start+1}–${Math.min(start+PAGE_SIZE,exercises.length)} von ${exercises.length}</div>`;
  html+=`<div class="pg-btns">`;
  for(let p=0;p<totalPages;p++)html+=`<button class="pg-btn${p===page?' active-pg':''}" onclick="changePage(${idx},${p})">${p+1}</button>`;
  html+=`</div>`;
  Object.entries(grouped).forEach(([sub,exs])=>{
    html+=`<div class="subsec">${sub}</div>`;
    exs.forEach(ex=>{html+=renderExercise(ex);});
  });
  html+=`<div class="pg-btns" style="margin-top:2rem">`;
  if(page>0)html+=`<button class="pg-btn" onclick="changePage(${idx},${page-1})">← Zurück</button>`;
  if(page<totalPages-1)html+=`<button class="pg-btn" onclick="changePage(${idx},${page+1})">Weiter →</button>`;
  html+=`</div>`;
  mc.innerHTML=html;
}
function changePage(secIdx,page){
  currentPage[secIdx]=page;
  renderSection(secIdx);
  window.scrollTo({top:0,behavior:'smooth'});
}
function renderExercise(ex){
  const num=ex.id;
  const isDone=state.answered.has(num);
  let html=`<div class="card${isDone?' ok':''}" id="card-${num}"><span class="card-num">#${num.toUpperCase()}</span>`;
  html+=`<div class="prompt">${ex.q}</div>`;
  if(ex.type==='mc'){
    const letters=['A','B','C','D'];
    html+=`<div class="choices">`;
    ex.opts.forEach((opt,i)=>{
      let cls='';
      if(isDone&&i===ex.ans)cls='ok';
      html+=`<button class="opt${cls?' '+cls:''}" onclick="checkMC('${num}',${i},${ex.ans},'${(ex.exp||'').replace(/'/g,"\\'")}')"`+(isDone?' disabled':'')+`><span class="ltr">${letters[i]}</span>${opt}</button>`;
    });
    html+=`</div>`;
    if(isDone&&ex.exp)html+=`<div class="fb ok show"><i class="bi-check-circle-fill"></i> ${ex.exp}</div>`;
    else html+=`<div class="fb" id="fb-${num}"></div>`;
  } else if(ex.type==='fill'){
    const w=ex.inp==='blank'?'inp-sm':ex.inp==='medium'?'inp-md':'inp-lg';
    html+=`<div class="fill-row"><input class="inp ${w}" id="inp-${num}" placeholder="…"${isDone?' disabled':''}></div>`;
    if(!isDone)html+=`<button class="btn" onclick="checkFill('${num}')">Prüfen</button>`;
    html+=`<div class="fb" id="fb-${num}">${isDone?'<span style="color:var(--p)">Beantwortet.</span>':''}</div>`;
  } else if(ex.type==='transform'){
    html+=`<textarea class="inp" id="inp-${num}" placeholder="Antwort …"${isDone?' disabled':''}></textarea>`;
    if(ex.hint)html+=`<span class="hint-lnk" onclick="toggleHint('hint-${num}')"><i class="bi-search"></i> Tipp anzeigen</span><div class="hint-box" id="hint-${num}">${ex.hint}</div>`;
    if(!isDone)html+=`<button class="btn" onclick="checkTransform('${num}')">Prüfen</button>`;
    html+=`<div class="fb" id="fb-${num}">${isDone?'<span style="color:var(--p)">Beantwortet.</span>':''}</div>`;
  }
  html+=`</div>`;
  return html;
}
function checkMC(id,chosen,correct,exp){
  if(state.answered.has(id))return;
  state.answered.add(id);state.total++;
  const card=document.getElementById('card-'+id);
  card.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(i===correct)b.classList.add('ok');else if(i===chosen)b.classList.add('err');});
  const ok=chosen===correct;
  if(ok)state.correct++;
  const fb=document.getElementById('fb-'+id);
  if(fb){fb.innerHTML=ok?`<i class="bi-check-circle-fill"></i> Richtig! ${exp}`:`<i class="bi-x-circle-fill"></i> Falsch. Richtig: Option ${['A','B','C','D'][correct]}. ${exp}`;fb.className='fb '+(ok?'ok':'err')+' show';}
  card.classList.add(ok?'ok':'err');
  updateScore();
}
function findEx(id){for(const sec of SECTIONS)for(const ex of sec.exercises)if(ex.id===id)return ex;return null;}
function checkFill(id){
  if(state.answered.has(id))return;
  const ex=findEx(id);if(!ex)return;
  const inp=document.getElementById('inp-'+id);
  const val=inp.value.trim().toLowerCase();
  const ok=ex.ans.some(a=>val===a.toLowerCase()||val.replace(/\s+/g,' ')===a.toLowerCase());
  state.answered.add(id);state.total++;
  if(ok)state.correct++;
  inp.disabled=true;inp.classList.add(ok?'ok':'err');
  const card=document.getElementById('card-'+id);card.classList.add(ok?'ok':'err');
  const fb=document.getElementById('fb-'+id);
  fb.innerHTML=ok?`<i class="bi-check-circle-fill"></i> Richtig! ${ex.exp||''}`:`<i class="bi-x-circle-fill"></i> Falsch. Richtig: <strong>${ex.ans[0]}</strong>. ${ex.exp||''}`;
  fb.className='fb '+(ok?'ok':'err')+' show';
  updateScore();
}
function checkTransform(id){
  if(state.answered.has(id))return;
  const ex=findEx(id);if(!ex)return;
  const ta=document.getElementById('inp-'+id);
  const val=ta.value.trim().toLowerCase();
  if(!val){const fb=document.getElementById('fb-'+id);fb.innerHTML='<i class="bi-exclamation-triangle-fill"></i> Bitte einen Satz eingeben.';fb.className='fb err show';return;}
  const ok=ex.keys.every(k=>val.includes(k.toLowerCase()));
  state.answered.add(id);state.total++;
  if(ok)state.correct++;
  ta.disabled=true;ta.classList.add(ok?'ok':'err');
  const card=document.getElementById('card-'+id);card.classList.add(ok?'ok':'err');
  const fb=document.getElementById('fb-'+id);
  fb.innerHTML=ok?`<i class="bi-check-circle-fill"></i> Gut! Enthält die wesentlichen Elemente.`:`<i class="bi-x-circle-fill"></i> Überprüfe deine Antwort. Tipp: ${ex.hint||''}`;
  fb.className='fb '+(ok?'ok':'err')+' show';
  updateScore();
}
function toggleHint(id){const h=document.getElementById(id);if(h)h.classList.toggle('show');}
buildTabs();
renderSection(0);
</script>
